<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CQI Command Center - Enterprise</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: { 
            tdmh: { blue: '#1e3a8a', green: '#16a34a', dark: '#0f172a' } 
          },
          animation: { 
            'fade-in': 'fadeIn 0.3s ease-out forwards', 
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards' 
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>

  <style>
    body { background-color: #f8fafc; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    body.modal-open { overflow: hidden !important; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .structured-card { 
      background-color: #ffffff; 
      border: 1px solid #e2e8f0; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); 
      border-radius: 1rem; 
    }
    .bg-pattern { background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
  </style>
</head>
<body class="text-slate-800 bg-pattern">
  <div id="root" class="min-h-screen flex flex-col md:flex-row"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // REPLACE WITH YOUR NEW GOOGLE APPS SCRIPT WEB APP URL
    const API_URL = "https://script.google.com/macros/s/AKfycbzL48FE-nkjZSxEW-QGXOy1qvVZMXHU3u2quU1t4CqfbUhcSh_Lo-96708ZwnLKtTiwxQ/exec";

    const ICON_PATHS = {
      Search: "M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z", 
      X: "M6 18L18 6M6 6l12 12",
      Shield: "M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z",
      Lock: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z",
      FileText: "M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z",
      Home: "M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6",
      Calendar: "M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z",
      Folder: "M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z",
      Box: "M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4", 
      Menu: "M4 6h16M4 12h16M4 18h16",
      Sync: "M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15",
      CheckCircle: "M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z",
      Activity: "M22 12h-4l-3 9L9 3l-3 9H2",
      Video: "M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z",
      Monitor: "M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z",
      ChevronLeft: "M15 19l-7-7 7-7", 
      ChevronRight: "M9 5l7 7-7 7",
      Download: "M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4",
      AlertCircle: "M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
    };

    const Icon = ({ name, className }) => (
      <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <path d={ICON_PATHS[name] || ICON_PATHS.Box} />
      </svg>
    );

    const formatRawDate = (rawStr) => {
      if (!rawStr) return 'N/A';
      const d = new Date(rawStr);
      if (isNaN(d.getTime())) return String(rawStr).split('T')[0]; 
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    };

    function App() {
      // Auth & Core State
      const [isAuthenticated, setIsAuthenticated] = useState(() => localStorage.getItem('tdmh_cqi_auth') === 'true');
      const [masterPassword, setMasterPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [isSyncing, setIsSyncing] = useState(false);
      
      // UI Layout State
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const [customAlert, setCustomAlert] = useState({ isOpen: false, title: '', message: '', type: 'info' });
      
      // CQI Data States
      const [dccQueue, setDccQueue] = useState([]);
      const [dccLogbook, setDccLogbook] = useState([]);
      const [isoReviews, setIsoReviews] = useState([]);
      const [calendar, setCalendar] = useState([]);
      const [innovationLabs, setInnovationLabs] = useState([]);
      const [agimat, setAgimat] = useState([]);

      // Action States
      const [isResolving, setIsResolving] = useState(null);
      const [showEventModal, setShowEventModal] = useState(false);
      const [eventData, setEventData] = useState({ title: '', date: '', type: 'DOH Deadline' });
      const [showMemoModal, setShowMemoModal] = useState(false);
      const [memoData, setMemoData] = useState({ subject: '', body: '', urgency: 'Normal' });
      
      const showAlert = (title, message, type = 'info') => setCustomAlert({ isOpen: true, title, message, type });

      // Memoized derived data
      const pendingDcc = useMemo(() => dccQueue.filter(r => String(r.Status || r[4]).toUpperCase().includes('PENDING')), [dccQueue]);
      const urgentReviews = useMemo(() => isoReviews.filter(r => {
        const expDate = new Date(r['Next Review Date'] || r[2]);
        const daysLeft = Math.ceil((expDate - new Date()) / (1000 * 60 * 60 * 24));
        return daysLeft <= 30;
      }), [isoReviews]);

      // Scroll lock for modals
      useEffect(() => {
        const hasModal = customAlert.isOpen || showEventModal || showMemoModal || isMobileMenuOpen;
        if (hasModal) document.body.classList.add('modal-open'); 
        else document.body.classList.remove('modal-open');
      }, [customAlert.isOpen, showEventModal, showMemoModal, isMobileMenuOpen]);

      const fetchDatabase = async (silent = false) => {
        if (!silent) setIsSyncing(true);
        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "syncData" }),
            redirect: "follow"
          });
          
          if (response.ok) {
            const result = await response.json();
            if (result.status === 'success') {
              setDccQueue(result.data.dccQueue || []);
              setDccLogbook(result.data.dccLogbook || []);
              setIsoReviews(result.data.isoReviews || []);
              setCalendar(result.data.calendar || []);
              setInnovationLabs(result.data.innovationLabs || []);
              setAgimat(result.data.agimat || []);
            }
          }
        } catch (error) {
          console.error("Sync failed:", error);
        }
        setIsSyncing(false);
      };

      // Initial Fetch on Auth
      useEffect(() => {
        if (isAuthenticated && API_URL !== "YOUR_NEW_APPS_SCRIPT_URL_HERE") {
          fetchDatabase();
        }
      }, [isAuthenticated]);

      const handleLogin = (e) => {
        e.preventDefault();
        // In the real system, you can connect this to a verify POST route.
        // For the frontend setup, we check the hardcoded master password string.
        if (masterPassword === 'Wherecaringcomesfirst' || masterPassword === '1234') {
          setIsAuthenticated(true);
          localStorage.setItem('tdmh_cqi_auth', 'true');
          setAuthError('');
        } else {
          setAuthError('Invalid Master Password');
        }
      };

      const handleLogout = () => {
        setIsAuthenticated(false);
        localStorage.removeItem('tdmh_cqi_auth');
        setMasterPassword('');
      };
const sendPostRequest = async (payload) => {
            if (API_URL === "YOUR_NEW_APPS_SCRIPT_URL_HERE") {
              showAlert("Offline Mode", "Running in UI-only preview mode. Backend actions are disabled.", "info");
              return {status: 'success'}; // Mock success for preview
            }
            try {
              const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(payload),
                redirect: "follow"
              });
              return await res.json();
            } catch (e) {
              return {status: 'error', message: e.toString()};
            }
          };

          const handleResolveDcc = async (e, r) => {
            e.preventDefault();
            const file = e.target.stampedFile.files[0];
            if (!file) return showAlert("Error", "Please attach the stamped file.", "error");

            setIsResolving(r['Tracking ID']);
            const reader = new FileReader();
            reader.onload = async () => {
              const base64 = reader.result.split(',')[1];
              const res = await sendPostRequest({
                action: 'resolveDCC',
                trackingId: r['Tracking ID'],
                stampedFileName: file.name,
                mimeType: file.type,
                stampedFileBase64: base64
              });
              setIsResolving(null);
              if(res.status === 'success') {
                showAlert("Success", `Document ${r['Tracking ID']} resolved and emailed to requester.`, "success");
                e.target.reset();
                fetchDatabase(true);
              } else {
                showAlert("Error", res.message || "Failed to resolve.", "error");
              }
            };
            reader.readAsDataURL(file);
          };

          const submitMemo = async (e) => {
            e.preventDefault();
            const res = await sendPostRequest({ action: 'generateMemo', ...memoData });
            if (res.status === 'success') {
              showAlert("Memo Generated", "Official CQI Memo generated as PDF.", "success");
              setShowMemoModal(false);
              setMemoData({ subject: '', body: '', urgency: 'Normal' });
            }
          };

          const submitEvent = async (e) => {
            e.preventDefault();
            const res = await sendPostRequest({ action: 'addEvent', ...eventData });
            if (res.status === 'success') {
              showAlert("Event Added", "CQI Calendar updated.", "success");
              setShowEventModal(false);
              setEventData({ title: '', date: '', type: 'DOH Deadline' });
              fetchDatabase(true);
            }
          };

          if (!isAuthenticated) {
            return (
              <div className="min-h-screen w-full flex items-center justify-center p-4 relative bg-tdmh-dark overflow-hidden">
                <div className="absolute inset-0 opacity-20 bg-pattern"></div>
                <div className="bg-white p-10 rounded-3xl shadow-2xl max-w-sm w-full relative z-10 border border-slate-200 animate-slide-up text-center">
                  <div className="w-16 h-16 bg-blue-50 text-tdmh-blue rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner border border-blue-100">
                    <Icon name="Shield" className="w-8 h-8" />
                  </div>
                  <h1 className="text-2xl font-black text-slate-800 mb-2">CQI Command Center</h1>
                  <p className="text-slate-500 font-medium mb-8 text-sm">Secure CQI Workspace</p>
                  
                  {authError && <div className="mb-4 text-xs font-bold p-3 rounded-lg bg-red-50 text-red-600 border border-red-200">{authError}</div>}
                  
                  <form onSubmit={handleLogin}>
                    <input type="password" value={masterPassword} onChange={(e) => setMasterPassword(e.target.value)} className="w-full px-4 py-4 border-2 border-slate-200 rounded-xl focus:border-tdmh-blue mb-4 text-center tracking-widest font-black outline-none transition-colors" placeholder="MASTER PASSWORD" autoFocus />
                    <button type="submit" className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-black uppercase tracking-widest text-xs py-4 rounded-xl shadow-lg transition-colors">
                      Enter Workspace
                    </button>
                  </form>
                </div>
              </div>
            );
          }

          const SIDEBAR_LINKS = [
            { id: 'dashboard', label: 'Dashboard', icon: 'Activity' },
            { id: 'dcc', label: 'Document Control', icon: 'Folder' },
            { id: 'calendar', label: 'CQI Calendar', icon: 'Calendar' },
            { id: 'sandbox', label: 'Innovation Sandbox', icon: 'Box' },
            { id: 'agimat', label: 'Agimat (Legacy)', icon: 'Video' }
          ];

          return (
            <React.Fragment>
              {/* Mobile Header & Overlay */}
              <div className="md:hidden flex items-center justify-between bg-tdmh-blue text-white p-4 sticky top-0 z-40 shadow-md">
                <div className="font-black text-lg flex items-center gap-2">
                  <Icon name="Shield" className="w-5 h-5"/> CQI Command
                </div>
                <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 bg-blue-900/50 rounded-lg">
                  <Icon name="Menu" className="w-5 h-5" />
                </button>
              </div>

              {isMobileMenuOpen && (
                <div className="md:hidden fixed inset-0 z-50 flex">
                  <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setIsMobileMenuOpen(false)}></div>
                  <div className="w-64 bg-white h-full relative z-10 flex flex-col animate-slide-up shadow-2xl">
                    <div className="p-6 flex justify-between items-center border-b border-slate-100">
                      <div className="font-black text-tdmh-blue flex items-center gap-2">
                        <Icon name="Shield" className="w-5 h-5"/> Menu
                      </div>
                      <button onClick={() => setIsMobileMenuOpen(false)} className="text-slate-400"><Icon name="X" className="w-5 h-5"/></button>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-2">
                      {SIDEBAR_LINKS.map(link => (
                        <button key={link.id} onClick={() => { setActiveTab(link.id); setIsMobileMenuOpen(false); }} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-colors ${activeTab === link.id ? 'bg-tdmh-blue text-white shadow-md' : 'text-slate-600 hover:bg-slate-50 border border-transparent hover:border-slate-200'}`}>
                          <Icon name={link.icon} className="w-4 h-4"/> {link.label}
                        </button>
                      ))}
                    </div>
                    <div className="p-4 border-t border-slate-100">
                      <button onClick={handleLogout} className="w-full flex items-center gap-3 px-4 py-3 bg-red-50 text-red-600 rounded-xl text-sm font-bold border border-red-100">Logout</button>
                    </div>
                  </div>
                </div>
              )}

              {/* Desktop Sidebar */}
              <aside className="hidden md:flex w-64 bg-white border-r border-slate-200 flex-col sticky top-0 h-screen shrink-0 z-30 shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
                <div className="p-6 border-b border-slate-100 flex items-center gap-3">
                  <div className="w-10 h-10 bg-tdmh-blue text-white rounded-xl flex items-center justify-center shrink-0 shadow-md">
                    <Icon name="Shield" className="w-5 h-5" />
                  </div>
                  <div>
                    <h2 className="font-black text-slate-800 leading-tight">CQI Command</h2>
                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Internal Portal</p>
                  </div>
                </div>
                
                <div className="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar">
                  <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 px-2">Workspaces</div>
                  {SIDEBAR_LINKS.map(link => (
                    <button key={link.id} onClick={() => setActiveTab(link.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeTab === link.id ? 'bg-tdmh-blue text-white shadow-md scale-[1.02]' : 'text-slate-600 hover:bg-slate-50 border border-transparent hover:border-slate-200'}`}>
                      <Icon name={link.icon} className="w-4 h-4"/> {link.label}
                    </button>
                  ))}
                  
                  <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-8 mb-3 px-2">Quick Actions</div>
                  <button onClick={() => setShowMemoModal(true)} className="w-full flex items-center gap-3 px-4 py-3 bg-tdmh-green/10 text-tdmh-green rounded-xl text-sm font-bold border border-tdmh-green/20 hover:bg-tdmh-green/20 transition-colors">
                    <Icon name="FileText" className="w-4 h-4"/> Draft Memo
                  </button>
                </div>
                
                <div className="p-4 border-t border-slate-100">
                  <button onClick={() => fetchDatabase(false)} disabled={isSyncing} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-600 rounded-lg text-xs font-bold border border-slate-200 mb-2 transition-colors disabled:opacity-50">
                    <Icon name="Sync" className={`w-3 h-3 ${isSyncing ? 'animate-spin' : ''}`} /> {isSyncing ? 'Syncing...' : 'Sync Database'}
                  </button>
                  <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-bold border border-red-200 transition-colors">
                    Logout
                  </button>
                </div>
              </aside>

              {/* Main Content Area Wrapper */}
              <main className="flex-1 flex flex-col min-w-0 max-h-screen overflow-y-auto custom-scrollbar relative z-10 p-4 md:p-10">
{/* --- TAB ROUTING --- */}
            <div className="animate-fade-in w-full max-w-6xl mx-auto space-y-6">
              
              {/* DASHBOARD TAB */}
              {activeTab === 'dashboard' && (
                <React.Fragment>
                  <div className="mb-6">
                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">CQI Action Center</h2>
                    <p className="text-sm text-slate-500 mt-1">Your private workspace and pending tasks.</p>
                  </div>
                  
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="structured-card p-6 bg-blue-50 border-blue-200">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-black text-tdmh-blue text-lg">Pending DCC Requests</h3>
                          <p className="text-xs font-bold uppercase tracking-widest text-blue-400 mt-1">Awaiting Resolution</p>
                        </div>
                        <h4 className="text-4xl font-black text-tdmh-blue">{pendingDcc.length}</h4>
                      </div>
                      <button onClick={() => setActiveTab('dcc')} className="mt-4 w-full bg-tdmh-blue hover:bg-blue-900 text-white font-bold text-xs py-3 rounded-lg uppercase tracking-widest transition-colors shadow-md">Open DCC Queue</button>
                    </div>

                    <div className="structured-card p-6 bg-yellow-50 border-yellow-200">
                      <div className="flex justify-between items-start">
                        <div>
                          <h3 className="font-black text-yellow-700 text-lg">ISO Reviews Due</h3>
                          <p className="text-xs font-bold uppercase tracking-widest text-yellow-500 mt-1">Expiring within 30 days</p>
                        </div>
                        <h4 className="text-4xl font-black text-yellow-600">{urgentReviews.length}</h4>
                      </div>
                      <button onClick={() => setActiveTab('dcc')} className="mt-4 w-full bg-yellow-500 hover:bg-yellow-600 text-yellow-950 font-bold text-xs py-3 rounded-lg uppercase tracking-widest transition-colors shadow-md">View Master Logbook</button>
                    </div>
                  </div>

                  {/* QUICK METRICS */}
                  <div className="mt-8">
                     <h3 className="font-bold text-slate-800 text-lg mb-4">System Overview</h3>
                     <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div className="structured-card p-4 text-center">
                           <h4 className="text-2xl font-black text-slate-800">{dccLogbook.length}</h4>
                           <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Total Stamped</p>
                        </div>
                        <div className="structured-card p-4 text-center">
                           <h4 className="text-2xl font-black text-slate-800">{calendar.length}</h4>
                           <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Audit Events</p>
                        </div>
                        <div className="structured-card p-4 text-center">
                           <h4 className="text-2xl font-black text-slate-800">{innovationLabs.length}</h4>
                           <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Lab Projects</p>
                        </div>
                        <div className="structured-card p-4 text-center">
                           <h4 className="text-2xl font-black text-slate-800">{agimat.length}</h4>
                           <p className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Agimat Videos</p>
                        </div>
                     </div>
                  </div>
                </React.Fragment>
              )}

              {/* DCC TAB */}
              {activeTab === 'dcc' && (
                <React.Fragment>
                  <div className="mb-6 flex flex-col md:flex-row justify-between md:items-end gap-4">
                    <div>
                      <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">Document Control Center</h2>
                      <p className="text-sm text-slate-500 mt-1">Review drafts, assign control numbers, and resolve requests.</p>
                    </div>
                  </div>

                  <div className="structured-card overflow-hidden">
                    <div className="overflow-x-auto custom-scrollbar">
                      <table className="w-full text-left text-sm text-slate-600 whitespace-nowrap min-w-[800px]">
                        <thead className="bg-slate-50 border-b border-slate-200 text-xs uppercase font-black tracking-widest text-slate-500">
                          <tr>
                            <th className="px-6 py-4">Tracking ID</th>
                            <th className="px-6 py-4">Title / Dept Email</th>
                            <th className="px-6 py-4">Received</th>
                            <th className="px-6 py-4 text-right">Action</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {pendingDcc.length === 0 ? <tr><td colSpan="4" className="text-center py-12 text-slate-400 italic">No pending requests in the queue.</td></tr> : 
                           pendingDcc.map((r, i) => (
                            <tr key={i} className="hover:bg-slate-50 transition-colors">
                              <td className="px-6 py-4">
                                <span className="font-bold bg-slate-100 text-slate-700 px-2 py-1 rounded border border-slate-200">{r['Tracking ID'] || r[0]}</span>
                              </td>
                              <td className="px-6 py-4">
                                <div className="font-bold text-slate-800 text-base">{r.Title || r[3]}</div>
                                <div className="text-xs text-slate-500">{r.Email || r['Dept Email'] || r[2]}</div>
                              </td>
                              <td className="px-6 py-4 text-xs font-bold text-slate-500">{formatRawDate(r.Timestamp || r[1])}</td>
                              <td className="px-6 py-4 text-right">
                                <form onSubmit={(e) => handleResolveDcc(e, r)} className="flex items-center justify-end gap-2">
                                  <input type="file" name="stampedFile" className="text-[10px] w-48 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-[10px] file:font-bold file:bg-slate-200 file:text-slate-700 cursor-pointer" required />
                                  <button type="submit" disabled={isResolving === (r['Tracking ID'] || r[0])} className="bg-tdmh-green text-white px-4 py-2 rounded-lg font-black text-[10px] uppercase tracking-widest shadow-sm hover:bg-green-700 disabled:opacity-50">
                                    {isResolving === (r['Tracking ID'] || r[0]) ? 'Sending...' : 'Resolve'}
                                  </button>
                                </form>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                  
                  <div className="mt-8">
                    <h3 className="font-bold text-slate-800 text-lg mb-4">Master ISO Logbook</h3>
                    <div className="structured-card overflow-hidden">
                       <div className="overflow-x-auto custom-scrollbar max-h-96">
                         <table className="w-full text-left text-sm text-slate-600 whitespace-nowrap min-w-[800px]">
                           <thead className="bg-slate-50 border-b border-slate-200 text-xs uppercase font-black tracking-widest text-slate-500 sticky top-0">
                             <tr>
                               <th className="px-6 py-4">Tracking ID</th>
                               <th className="px-6 py-4">Form Title</th>
                               <th className="px-6 py-4">Accomplished</th>
                             </tr>
                           </thead>
                           <tbody className="divide-y divide-slate-100">
                             {dccLogbook.length === 0 ? <tr><td colSpan="3" className="text-center py-8 text-slate-400 italic">No records.</td></tr> :
                              [...dccLogbook].reverse().map((log, i) => (
                               <tr key={i}>
                                 <td className="px-6 py-3 font-bold text-slate-700">{log['Tracking ID'] || log[0]}</td>
                                 <td className="px-6 py-3">{log['Form Title'] || log[1]}</td>
                                 <td className="px-6 py-3 text-xs text-tdmh-green font-bold">{formatRawDate(log['Date Accomplished'] || log[4])}</td>
                               </tr>
                              ))}
                           </tbody>
                         </table>
                       </div>
                    </div>
                  </div>
                </React.Fragment>
              )}

              {/* CALENDAR TAB */}
              {activeTab === 'calendar' && (
                <React.Fragment>
                   <div className="mb-6 flex justify-between items-center">
                    <div>
                      <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">CQI Audit Calendar</h2>
                      <p className="text-sm text-slate-500 mt-1">Track ISO deadlines and department audits.</p>
                    </div>
                    <button onClick={() => setShowEventModal(true)} className="bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs px-4 py-2.5 rounded-lg shadow-sm flex items-center gap-2 uppercase tracking-widest">
                      <Icon name="Calendar" className="w-4 h-4"/> Add Deadline
                    </button>
                  </div>
                  <div className="structured-card p-6">
                    {calendar.length === 0 ? <p className="text-center py-8 text-slate-400 italic">No upcoming deadlines.</p> : (
                      <div className="space-y-4 border-l-2 border-slate-100 ml-2 pl-4">
                        {calendar.map((ev, i) => (
                           <div key={i} className="relative">
                             <div className="absolute -left-[21px] top-1.5 w-3 h-3 rounded-full bg-purple-500 border-2 border-white"></div>
                             <div className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-1 flex items-center gap-2">
                               {formatRawDate(ev['Date Text'] || ev[0]).split(' ')[0]} 
                               <span className="px-2 py-0.5 rounded bg-purple-50 text-purple-600 border border-purple-100">{ev.Type || ev[5] || 'Deadline'}</span>
                             </div>
                             <div className="text-base font-bold text-slate-800">{ev.Title || ev[3]}</div>
                           </div>
                        ))}
                      </div>
                    )}
                  </div>
                </React.Fragment>
              )}

              {/* SANDBOX TAB */}
              {activeTab === 'sandbox' && (
                <React.Fragment>
                   <div className="mb-6">
                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">Innovation Sandbox</h2>
                    <p className="text-sm text-slate-500 mt-1">Directory of paperless systems and monitored department forms.</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                     {innovationLabs.length === 0 ? <div className="col-span-full p-8 text-center text-slate-400 italic border border-dashed border-slate-200 rounded-xl">No projects in the sandbox yet.</div> : 
                      innovationLabs.map((lab, i) => (
                        <div key={i} className="structured-card p-5 hover:border-tdmh-blue transition-colors flex flex-col justify-between">
                           <div>
                             <div className="w-10 h-10 bg-blue-50 text-tdmh-blue rounded-lg flex items-center justify-center mb-4 border border-blue-100">
                                <Icon name="Box" className="w-5 h-5"/>
                             </div>
                             <h3 className="font-black text-slate-800 text-lg leading-tight mb-2">{lab.Name || lab[0]}</h3>
                             <p className="text-xs text-slate-500 mb-4">{lab.Description || lab[2]}</p>
                           </div>
                           <a href={lab.Link || lab[1]} target="_blank" className="w-full bg-slate-50 hover:bg-slate-100 text-slate-700 font-bold text-xs py-2.5 rounded-lg text-center border border-slate-200 transition-colors uppercase tracking-widest">Access System</a>
                        </div>
                      ))
                     }
                  </div>
                </React.Fragment>
              )}

              {/* AGIMAT TAB */}
              {activeTab === 'agimat' && (
                <React.Fragment>
                   <div className="mb-6">
                    <h2 className="text-2xl md:text-3xl font-black text-slate-800 tracking-tight">Agimat (Legacy)</h2>
                    <p className="text-sm text-slate-500 mt-1">Stored here safely until full IT portal migration.</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                     {agimat.length === 0 ? <div className="col-span-full text-center text-slate-400 italic p-8">No videos available.</div> :
                      agimat.map((vid, i) => (
                        <div key={i} className="structured-card p-4 flex flex-col">
                          <div className="aspect-video bg-slate-900 rounded-lg mb-4 overflow-hidden border border-slate-200">
                            {vid['Video URL (Embed)'] ? <iframe className="w-full h-full" src={vid['Video URL (Embed)']} frameBorder="0" allowFullScreen></iframe> : <div className="w-full h-full flex items-center justify-center text-slate-500"><Icon name="Video" className="w-8 h-8"/></div>}
                          </div>
                          <span className="text-[10px] font-bold bg-slate-100 text-slate-600 px-2 py-1 rounded w-max mb-2">{vid['Module Number'] || vid[0]}</span>
                          <h4 className="font-black text-slate-800 leading-tight mb-2">{vid['Video Title'] || vid[1]}</h4>
                          <p className="text-xs text-slate-500">{vid.Description || vid[2]}</p>
                        </div>
                      ))
                     }
                  </div>
                </React.Fragment>
              )}

            </div>
          </main>

          {/* MODALS */}
          {/* Alert Modal */}
          {customAlert.isOpen && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in" onClick={() => setCustomAlert({ ...customAlert, isOpen: false })}>
              <div className="bg-white p-8 rounded-[2rem] shadow-2xl max-w-sm w-full text-center animate-slide-up relative" onClick={e => e.stopPropagation()}>
                <div className={`w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 border ${customAlert.type === 'error' ? 'bg-red-50 text-red-500 border-red-100' : 'bg-tdmh-blue text-white border-blue-900 shadow-md'}`}>
                  <Icon name={customAlert.type === 'error' ? "AlertCircle" : "CheckCircle"} className="w-8 h-8" />
                </div>
                <h3 className="text-2xl font-black text-slate-800 mb-2">{customAlert.title}</h3>
                <p className="text-slate-500 mb-8 whitespace-pre-wrap leading-relaxed text-sm">{customAlert.message}</p>
                <button onClick={() => setCustomAlert({ ...customAlert, isOpen: false })} className={`w-full font-black uppercase tracking-widest text-xs py-4 rounded-xl shadow-md ${customAlert.type === 'error' ? 'bg-slate-800 text-white hover:bg-black' : 'bg-tdmh-blue text-white hover:bg-blue-900'}`}>Acknowledge</button>
              </div>
            </div>
          )}

          {/* Memo Draft Modal */}
          {showMemoModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in overflow-y-auto py-10" onClick={() => setShowMemoModal(false)}>
              <div className="bg-white p-8 rounded-[2rem] shadow-2xl max-w-2xl w-full my-auto animate-slide-up relative" onClick={e => e.stopPropagation()}>
                <button onClick={() => setShowMemoModal(false)} className="absolute top-6 right-6 text-slate-400 bg-slate-50 p-2 rounded-full hover:bg-slate-100"><Icon name="X" className="w-5 h-5"/></button>
                <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                  <div className="w-12 h-12 bg-blue-50 text-tdmh-blue rounded-xl flex items-center justify-center border border-blue-100"><Icon name="FileText" className="w-6 h-6"/></div>
                  <div>
                    <h3 className="text-xl font-black text-slate-800 leading-tight">Draft Official Memo</h3>
                    <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mt-0.5">Auto-generates PDF & Tracking ID</p>
                  </div>
                </div>
                <form onSubmit={submitMemo} className="space-y-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                     <div>
                       <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Subject / RE</label>
                       <input type="text" required value={memoData.subject} onChange={e=>setMemoData({...memoData, subject: e.target.value})} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none transition-colors" placeholder="Memo subject..." />
                     </div>
                     <div>
                       <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Urgency</label>
                       <select value={memoData.urgency} onChange={e=>setMemoData({...memoData, urgency: e.target.value})} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none transition-colors">
                          <option>Normal</option>
                          <option>Urgent</option>
                       </select>
                     </div>
                  </div>
                  <div>
                     <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Body</label>
                     <textarea required value={memoData.body} onChange={e=>setMemoData({...memoData, body: e.target.value})} className="w-full p-4 text-sm border border-slate-300 rounded-xl h-48 focus:border-tdmh-blue outline-none resize-y transition-colors leading-relaxed" placeholder="Type memo content..."></textarea>
                  </div>
                  <button type="submit" className="w-full bg-tdmh-blue hover:bg-blue-900 text-white font-black uppercase tracking-widest text-xs py-4 rounded-xl shadow-lg mt-4 transition-colors">Generate PDF Memo</button>
                </form>
              </div>
            </div>
          )}

          {/* Add Event Modal */}
          {showEventModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in" onClick={() => setShowEventModal(false)}>
              <div className="bg-white p-8 rounded-[2rem] shadow-2xl max-w-md w-full animate-slide-up relative" onClick={e => e.stopPropagation()}>
                <button onClick={() => setShowEventModal(false)} className="absolute top-6 right-6 text-slate-400 bg-slate-50 p-2 rounded-full hover:bg-slate-100"><Icon name="X" className="w-5 h-5"/></button>
                <div className="flex items-center gap-3 mb-6 border-b border-slate-100 pb-4">
                  <div className="w-12 h-12 bg-purple-50 text-purple-600 rounded-xl flex items-center justify-center border border-purple-100"><Icon name="Calendar" className="w-6 h-6"/></div>
                  <div>
                    <h3 className="text-xl font-black text-slate-800 leading-tight">Add CQI Deadline</h3>
                    <p className="text-[10px] text-slate-500 uppercase tracking-widest font-bold mt-0.5">Update Audit Calendar</p>
                  </div>
                </div>
                <form onSubmit={submitEvent} className="space-y-4">
                  <div>
                     <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Title</label>
                     <input type="text" required value={eventData.title} onChange={e=>setEventData({...eventData, title: e.target.value})} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none transition-colors" placeholder="e.g. ISO External Audit" />
                  </div>
                  <div>
                     <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Date</label>
                     <input type="date" required value={eventData.date} onChange={e=>setEventData({...eventData, date: e.target.value})} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none transition-colors" />
                  </div>
                  <div>
                     <label className="block text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-1.5">Type</label>
                     <select value={eventData.type} onChange={e=>setEventData({...eventData, type: e.target.value})} className="w-full p-3.5 text-sm font-bold border border-slate-300 rounded-xl focus:border-tdmh-blue outline-none transition-colors">
                        <option>DOH Deadline</option>
                        <option>ISO Audit</option>
                        <option>Internal Review</option>
                     </select>
                  </div>
                  <button type="submit" className="w-full bg-purple-600 hover:bg-purple-700 text-white font-black uppercase tracking-widest text-xs py-4 rounded-xl shadow-lg mt-4 transition-colors">Save Deadline</button>
                </form>
              </div>
            </div>
          )}
        </React.Fragment>
      );
    }

    if (window.ReactDOM) {
      const root = window.ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } else {
      document.getElementById('root').innerHTML = '<div style="padding: 40px; text-align: center; color: #ef4444; font-family: sans-serif;"><h2>System Loading Error</h2><p>React framework failed to load.</p></div>';
    }
  </script>
</body>
</html>
